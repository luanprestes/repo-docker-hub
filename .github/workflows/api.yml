name: "API: Build and Publish Docker Image"

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'api/**'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    # Only run when the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/repo-docker-hub
          tags: |
            # latest only on merges to the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # immutable sha tag for every build
            type=sha,prefix=sha-,format=short
            # semantic versions from git tags (e.g. v1.2.3 → 1.2.3 and 1.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build locally first so Trivy can scan before anything is pushed.
      # Scan only on amd64 because `load: true` cannot import multi-arch manifests
      # into the local Docker daemon — the multi-arch build happens on push below.
      - name: Build image (local, for scanning)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: ./api
          file: ./api/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee  # v0.9.2
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699  # v3.35.1
        if: always()  # upload even when the scan fails, so results are visible
        with:
          sarif_file: trivy-results.sarif

      # Only push to Docker Hub if the vulnerability scan passed
      - name: Push image to Docker Hub
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
