name: "Webhook: Build Validation"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'webhook/**'

permissions:
  contents: read

jobs:
  build-check:
    name: Build & Validate Webhook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: '1.24'

      - name: Build webhook binary
        working-directory: ./webhook
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o webhook ./main.go

      - name: Build Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: ./webhook
          file: ./webhook/Dockerfile
          load: true
          tags: repo-docker-hub-webhook:test
